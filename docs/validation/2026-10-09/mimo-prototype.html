<!DOCTYPE html>
<!-- ============================================================
  中文个人待办清单 MVP — 交互原型（工序 2，单文件、无外部依赖）
  对应需求：01_MVP需求文档.md（P0 全部实现，P1 实现数量统计）

  状态演示说明：
  - 加载状态：打开页面显示约 400ms「正在加载任务…」（模拟异步读取；真实读取为同步 localStorage）。
  - 空状态：无任务或筛选结果为空时，按「全部/未完成/已完成」显示对应文案。
  - 错误状态：localStorage 被禁用/抛异常，或点击「模拟存储故障」时，回退内存模式并显示警告横幅。

  模拟数据：首次打开载入 3 条虚构示例任务（买牛奶 / 写说明 / 散步），可一键清空或重置。
  未连接的服务：无后端接口、无账号体系、无云同步、无任何网络请求——数据仅存本机浏览器。

  安全要求：用户输入一律经 textContent / setAttribute 安全赋值渲染，全文件不使用 innerHTML。
============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>我的待办 — 个人待办清单 MVP 原型</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #e5e8f0;
    --primary: #2f6bed;
    --primary-dark: #1f4fc0;
    --danger: #d64545;
    --warn-bg: #fff6e5;
    --warn-ink: #8a5a00;
    --warn-line: #f0d089;
    --info-bg: #e8f1ff;
    --info-ink: #1f4a9c;
    --info-line: #b9d2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.6;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { font-size: 26px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  .banner {
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 12px;
    border: 1px solid transparent;
  }
  .banner[hidden] { display: none; }
  .banner--info { background: var(--info-bg); color: var(--info-ink); border-color: var(--info-line); }
  .banner--warn { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }

  .storage-line { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .storage-line .ok { color: #217a3d; }
  .storage-line .bad { color: var(--danger); font-weight: 600; }

  .composer { display: flex; gap: 8px; margin-bottom: 6px; }
  .composer input[type="text"] {
    flex: 1; min-width: 0; font-size: 16px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); outline: none;
  }
  .composer input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,107,237,.15); }
  .composer button {
    font-size: 16px; padding: 12px 20px; border: none; border-radius: 10px;
    background: var(--primary); color: #fff; cursor: pointer;
  }
  .composer button:hover { background: var(--primary-dark); }
  .composer button:active { transform: translateY(1px); }

  .input-error { color: var(--danger); font-size: 13px; margin: 4px 0 0; }
  .input-error[hidden] { display: none; }

  .filters { display: flex; gap: 8px; margin: 16px 0 8px; }
  .filter-btn {
    flex: 1; min-height: 40px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--muted); cursor: pointer;
  }
  .filter-btn.is-active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

  .stats { color: var(--muted); font-size: 13px; margin: 0 0 10px; min-height: 20px; }

  .list-area {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; min-height: 140px;
  }
  .loading { text-align: center; color: var(--muted); font-size: 14px; padding: 36px 0; margin: 0; }
  .loading[hidden] { display: none; }

  .task-list { list-style: none; margin: 0; padding: 0; }
  .task-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 8px; border-bottom: 1px solid var(--line);
  }
  .task-item:last-child { border-bottom: none; }
  .task-item input[type="checkbox"] { width: 20px; height: 20px; flex: none; accent-color: var(--primary); cursor: pointer; }
  .task-text { flex: 1; min-width: 0; font-size: 15px; word-break: break-word; }
  .task-item.is-done .task-text { text-decoration: line-through; color: var(--muted); }
  .del-btn {
    flex: none; min-height: 36px; padding: 6px 12px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--danger); cursor: pointer;
  }
  .del-btn:hover { background: #fdf0f0; border-color: #f3c2c2; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 36px 12px; }
  .empty[hidden] { display: none; }
  .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  .demo-panel {
    margin-top: 24px; border: 1px dashed #c9cfdd;
    border-radius: 12px; padding: 14px; background: #fbfcfe;
  }
  .demo-panel h2 { font-size: 14px; margin: 0 0 10px; }
  .demo-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .demo-btns button {
    font-size: 13px; min-height: 36px; padding: 6px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); cursor: pointer;
  }
  .demo-btns button:hover { border-color: var(--primary); color: var(--primary); }
  .demo-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  footer.note { font-size: 12px; color: var(--muted); margin-top: 16px; text-align: center; }

  @media (max-width: 480px) {
    .app { padding: 16px 12px 40px; }
    header h1 { font-size: 22px; }
    .composer button { padding: 12px 16px; }
    .del-btn { padding: 8px 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>我的待办</h1>
    <p class="subtitle">个人待办清单 MVP 交互原型 · 单文件 · 无账号 · 无后端</p>
  </header>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <p id="storageLine" class="storage-line">存储状态：检测中…</p>

  <section class="composer" aria-label="添加任务">
    <input id="taskInput" type="text" placeholder="想做点什么？例如：买牛奶" maxlength="120" autocomplete="off" aria-label="任务内容">
    <button id="addBtn" type="button">添加</button>
  </section>
  <p id="inputError" class="input-error" role="alert" hidden></p>

  <nav class="filters" aria-label="任务筛选">
    <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">全部</button>
    <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">未完成</button>
    <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">已完成</button>
  </nav>

  <p id="stats" class="stats"></p>

  <section id="listArea" class="list-area" aria-busy="true">
    <p id="loadingState" class="loading">正在加载任务…</p>
    <ul id="taskList" class="task-list"></ul>
    <div id="emptyState" class="empty" hidden>
      <strong id="emptyTitle"></strong>
      <span id="emptyText"></span>
    </div>
  </section>

  <section class="demo-panel" aria-label="原型演示控制">
    <h2>原型演示控制（仅用于演示各种状态）</h2>
    <div class="demo-btns">
      <button id="simFailBtn" type="button">模拟存储故障</button>
      <button id="recoverBtn" type="button">恢复存储并写回</button>
      <button id="seedBtn" type="button">重置为示例数据</button>
      <button id="clearAllBtn" type="button">清空全部任务</button>
    </div>
    <p class="demo-note">模拟数据：首次打开的 3 条任务为虚构演示内容。未连接的服务：本原型没有后端接口、账号体系与云同步，所有数据仅保存在本机浏览器 localStorage；该存储不可用时自动回退为内存模式（刷新即丢失）。任务文本上限 120 字（回应需求待确认项，默认限制长度）。</p>
  </section>

  <footer class="note">开发工序交付物 · 对应需求文档 01_MVP需求文档.md · 无任何外部依赖，可离线打开</footer>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'todo-mvp-tasks-v1';
  var FILTER_KEY = 'todo-mvp-filter-v1';
  var LOAD_DELAY_MS = 400; // 原型演示用：模拟一次异步加载过程

  var state = {
    tasks: [],
    filter: 'all',
    storageOk: true,
    simulateFailure: false,
    loading: true
  };

  var el = {
    banner: document.getElementById('banner'),
    storageLine: document.getElementById('storageLine'),
    taskInput: document.getElementById('taskInput'),
    addBtn: document.getElementById('addBtn'),
    inputError: document.getElementById('inputError'),
    stats: document.getElementById('stats'),
    listArea: document.getElementById('listArea'),
    loadingState: document.getElementById('loadingState'),
    taskList: document.getElementById('taskList'),
    emptyState: document.getElementById('emptyState'),
    emptyTitle: document.getElementById('emptyTitle'),
    emptyText: document.getElementById('emptyText'),
    simFailBtn: document.getElementById('simFailBtn'),
    recoverBtn: document.getElementById('recoverBtn'),
    seedBtn: document.getElementById('seedBtn'),
    clearAllBtn: document.getElementById('clearAllBtn')
  };

  var filterBtns = document.querySelectorAll('.filter-btn');

  // ---------- 工具 ----------
  function genId() {
    return 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function seedTasks() {
    // 公开虚构演示内容
    return [
      { id: genId(), text: '买牛奶和全麦面包', done: false, createdAt: Date.now() },
      { id: genId(), text: '给演示项目写一页说明', done: false, createdAt: Date.now() },
      { id: genId(), text: '晚饭后散步 30 分钟', done: true, createdAt: Date.now() }
    ];
  }

  function sanitizeTask(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.text !== 'string') return null;
    var text = raw.text.trim().slice(0, 120);
    if (!text) return null;
    return {
      id: typeof raw.id === 'string' ? raw.id : genId(),
      text: text,
      done: !!raw.done,
      createdAt: typeof raw.createdAt === 'number' ? raw.createdAt : Date.now()
    };
  }

  // ---------- 存储层：异常一律捕获，回退内存 ----------
  function probeLocalStorage() {
    try {
      var k = '__todo_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  function readRaw() {
    if (state.simulateFailure) throw new Error('已开启模拟存储故障');
    if (!probeLocalStorage()) throw new Error('localStorage 不可用（沙箱或隐私模式禁止存储）');
    return window.localStorage.getItem(STORAGE_KEY); // null = 首次运行
  }

  function writeRaw(json) {
    if (state.simulateFailure) throw new Error('已开启模拟存储故障');
    if (!probeLocalStorage()) throw new Error('localStorage 不可用（沙箱或隐私模式禁止存储）');
    window.localStorage.setItem(STORAGE_KEY, json);
  }

  function save() {
    try {
      writeRaw(JSON.stringify(state.tasks));
      state.storageOk = true;
      renderStorageLine();
      return true;
    } catch (e) {
      state.storageOk = false;
      renderStorageLine();
      showBanner('warn', '保存失败：' + e.message + '。已回退为内存模式，刷新后本次修改会丢失。');
      return false;
    }
  }

  // ---------- 横幅 / 状态提示 ----------
  function showBanner(kind, text) {
    el.banner.className = 'banner banner--' + kind;
    el.banner.textContent = text; // 安全文本赋值
    el.banner.hidden = false;
  }
  function hideBanner() { el.banner.hidden = true; el.banner.textContent = ''; }

  function renderStorageLine() {
    el.storageLine.textContent = '';
    var label = document.createElement('span');
    if (state.storageOk) {
      label.className = 'ok';
      label.textContent = '存储状态：✓ 正常（localStorage 本机保存，修改即时生效）';
    } else {
      label.className = 'bad';
      label.textContent = '存储状态：⚠ 内存模式（刷新后数据丢失）';
    }
    el.storageLine.appendChild(label);
  }

  // ---------- 渲染 ----------
  function visibleTasks() {
    if (state.filter === 'active') return state.tasks.filter(function (t) { return !t.done; });
    if (state.filter === 'done') return state.tasks.filter(function (t) { return t.done; });
    return state.tasks.slice();
  }

  function emptyCopy() {
    if (state.filter === 'active') {
      return { title: '没有未完成的任务', text: '切换到「全部」可查看所有任务，或添加一条新任务。' };
    }
    if (state.filter === 'done') {
      return { title: '还没有已完成的任务', text: '勾选一条任务后，它会出现在这里。' };
    }
    return { title: '列表是空的', text: '在上方输入内容并点击「添加」，记录你的第一条任务。' };
  }

  function render() {
    var total = state.tasks.length;
    var doneCount = 0;
    for (var i = 0; i < total; i++) if (state.tasks[i].done) doneCount++;
    el.stats.textContent = total > 0
      ? '共 ' + total + ' 项 · 未完成 ' + (total - doneCount) + ' · 已完成 ' + doneCount
      : '';

    for (var j = 0; j < filterBtns.length; j++) {
      var b = filterBtns[j];
      var active = b.getAttribute('data-filter') === state.filter;
      if (active) { b.classList.add('is-active'); } else { b.classList.remove('is-active'); }
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    }

    el.taskList.textContent = ''; // 清空旧节点
    if (state.loading) {
      el.loadingState.hidden = false;
      el.emptyState.hidden = true;
      el.listArea.setAttribute('aria-busy', 'true');
      return;
    }
    el.loadingState.hidden = true;
    el.listArea.setAttribute('aria-busy', 'false');

    var list = visibleTasks();
    if (list.length === 0) {
      var copy = emptyCopy();
      el.emptyTitle.textContent = copy.title;
      el.emptyText.textContent = copy.text;
      el.emptyState.hidden = false;
    } else {
      el.emptyState.hidden = true;
      for (var k = 0; k < list.length; k++) el.taskList.appendChild(renderItem(list[k]));
    }
  }

  function renderItem(task) {
    var li = document.createElement('li');
    li.className = 'task-item' + (task.done ? ' is-done' : '');

    var check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = task.done;
    check.setAttribute('aria-label', (task.done ? '取消完成：' : '标记完成：') + task.text);
    check.addEventListener('change', function () { toggleTask(task.id); });

    var span = document.createElement('span');
    span.className = 'task-text';
    span.textContent = task.text; // 用户输入只经此安全赋值渲染

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del-btn';
    del.textContent = '删除';
    del.setAttribute('aria-label', '删除任务：' + task.text);
    del.addEventListener('click', function () { deleteTask(task.id); });

    li.appendChild(check);
    li.appendChild(span);
    li.appendChild(del);
    return li;
  }

  // ---------- 业务操作 ----------
  function findTask(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }

  function addTask() {
    var text = el.taskInput.value.trim().slice(0, 120);
    if (!text) {
      el.inputError.textContent = '请输入任务内容，纯空白无法添加。';
      el.inputError.hidden = false;
      el.taskInput.focus();
      return;
    }
    el.inputError.hidden = true;
    el.inputError.textContent = '';
    state.tasks.push({ id: genId(), text: text, done: false, createdAt: Date.now() });
    var ok = save();
    if (state.filter === 'done') state.filter = 'all'; // 新任务在「已完成」筛选下不可见，自动切回「全部」
    el.taskInput.value = '';
    el.taskInput.focus();
    render();
    if (ok) hideBanner();
  }

  function toggleTask(id) {
    var t = findTask(id);
    if (!t) return;
    t.done = !t.done;
    save();
    render();
  }

  function deleteTask(id) {
    var next = [];
    for (var i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].id !== id) next.push(state.tasks[i]);
    }
    state.tasks = next;
    save();
    render();
  }

  function setFilter(f) {
    state.filter = f;
    try {
      if (!state.simulateFailure && probeLocalStorage()) window.localStorage.setItem(FILTER_KEY, f);
    } catch (e) { /* 筛选偏好保存失败不影响功能 */ }
    render();
  }

  function applyFilterPref() {
    try {
      var raw = state.simulateFailure ? null : window.localStorage.getItem(FILTER_KEY);
      if (raw === 'all' || raw === 'active' || raw === 'done') state.filter = raw;
    } catch (e) {
      state.filter = 'all';
    }
  }

  // ---------- 加载（含加载/错误状态） ----------
  function load() {
    state.loading = true;
    render();
    // 原型演示：用 setTimeout 模拟异步加载过程中的「加载状态」
    window.setTimeout(function () {
      var raw = null;
      try {
        raw = readRaw();
      } catch (e) {
        // 错误状态：读取失败 → 内存模式 + 警告横幅
        state.storageOk = false;
        state.tasks = seedTasks();
        applyFilterPref();
        state.loading = false;
        renderStorageLine();
        showBanner('warn', '读取存储失败：' + e.message + '。当前使用内存模式（示例数据），刷新后修改会丢失。');
        render();
        return;
      }
      if (raw === null) {
        // 首次运行：载入虚构示例数据
        state.tasks = seedTasks();
        state.storageOk = true;
        applyFilterPref();
        state.loading = false;
        if (save()) showBanner('info', '首次运行：已载入 3 条虚构示例任务，可直接体验或在下方一键清空。');
        render();
        return;
      }
      try {
        var parsed = JSON.parse(raw);
        var tasks = [];
        if (parsed && typeof parsed.length === 'number') {
          for (var i = 0; i < parsed.length; i++) {
            var t = sanitizeTask(parsed[i]);
            if (t) tasks.push(t);
          }
        }
        state.tasks = tasks;
        state.storageOk = true;
        applyFilterPref();
        state.loading = false;
        hideBanner();
        render();
      } catch (e2) {
        // 错误状态：本地数据格式异常
        state.storageOk = false;
        state.tasks = seedTasks();
        applyFilterPref();
        state.loading = false;
        renderStorageLine();
        showBanner('warn', '本地数据格式异常（' + e2.message + '），已用示例数据替代；建议清空后重新开始。');
        render();
      }
    }, LOAD_DELAY_MS);
  }

  // ---------- 演示控制 ----------
  el.simFailBtn.addEventListener('click', function () {
    state.simulateFailure = true;
    state.storageOk = false;
    renderStorageLine();
    showBanner('warn', '已开启「模拟存储故障」：后续保存/读取都会失败，用于演示错误状态。点击「恢复存储并写回」可退出。');
  });

  el.recoverBtn.addEventListener('click', function () {
    state.simulateFailure = false;
    try {
      if (!probeLocalStorage()) throw new Error('localStorage 不可用（沙箱或隐私模式禁止存储）');
      writeRaw(JSON.stringify(state.tasks));
      state.storageOk = true;
      renderStorageLine();
      showBanner('info', '存储已恢复，当前内存中的任务已写回本机存储。');
      render();
    } catch (e) {
      state.storageOk = false;
      renderStorageLine();
      showBanner('warn', '恢复失败：' + e.message + '。继续以内存模式运行。');
      render();
    }
  });

  el.seedBtn.addEventListener('click', function () {
    state.tasks = seedTasks();
    if (save()) showBanner('info', '已重置为 3 条虚构示例任务。');
    render();
  });

  el.clearAllBtn.addEventListener('click', function () {
    state.tasks = [];
    if (save()) hideBanner();
    render();
  });

  // ---------- 事件绑定 ----------
  el.addBtn.addEventListener('click', addTask);
  el.taskInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      addTask();
    }
  });
  el.taskInput.addEventListener('input', function () {
    if (!el.inputError.hidden) {
      el.inputError.hidden = true;
      el.inputError.textContent = '';
    }
  });
  for (var bi = 0; bi < filterBtns.length; bi++) {
    (function (btn) {
      btn.addEventListener('click', function () { setFilter(btn.getAttribute('data-filter')); });
    })(filterBtns[bi]);
  }

  // ---------- 启动 ----------
  renderStorageLine();
  load();
})();
</script>
</body>
</html>
